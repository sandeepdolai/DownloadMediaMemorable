services:
  - type: web
    name: memorableday-downloader-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_DOWNLOAD_MB
        value: "300"
      - key: MAX_DOWNLOAD_SECONDS
        value: "900"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: YT_DLP_SOCKET_TIMEOUT
        value: "20"
      - key: ALLOWED_ORIGINS
        value: https://memorableday.in,https://www.memorableday.in,https://memorableday-in.vercel.app,http://localhost:4321
