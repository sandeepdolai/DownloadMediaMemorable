name: Inspect memorableday_assets.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependency
        run: pip install Pillow
      - name: Inventory and preview all archive images
        run: python scripts/inspect-assets.py
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: memorableday-asset-inspection
          path: asset-inspection/
          if-no-files-found: error
          retention-days: 2
