name: Validate MemorableDay.in

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-memorableday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify FFmpeg binary
        run: node --input-type=module -e "import ffmpegPath from 'ffmpeg-static'; import { existsSync } from 'node:fs'; if (!ffmpegPath || !existsSync(ffmpegPath)) { console.error('FFmpeg binary is missing'); process.exit(1); } console.log('FFmpeg binary is ready');"

      - name: Check Vercel API syntax
        run: |
          node --check api/_lib/media.js
          node --check api/v1/inspect.js
          node --check api/v1/download.js

      - name: Build Astro for Vercel
        env:
          VERCEL: "1"
        run: npm run build
