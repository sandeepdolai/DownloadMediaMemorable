name: Deploy MemorableDay.in to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site and extract original assets
        run: |
          mkdir -p public/assets
          cp index.html styles.css script.js public/
          unzip -j memorableday_assets.zip \
            'png_cutouts_transparent/logo_m.png' \
            'png_cutouts_transparent/o_play.png' \
            'png_cutouts_transparent/o_globe.png' \
            -d public/assets/
          test -s public/assets/logo_m.png
          test -s public/assets/o_play.png
          test -s public/assets/o_globe.png
          ls -lh public/assets
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
